[package]
name = "rsfinity-wasm"
version = "0.1.0"
edition = "2024"
authors = ["rsfinity"]
description = "WASM library for Gridfinity mount swapping geometry operations"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1", optional = true }
nom = "8"
quick-xml = "0.37"
zip = { version = "2", default-features = false, features = ["deflate"] }
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Alternative: smaller binary size
[profile.release-small]
inherits = "release"
opt-level = "s"
